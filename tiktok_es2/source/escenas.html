<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}svg{display:block}</style>
</head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="576" height="1024" viewBox="0 0 576 1024"></svg>
<script>
const OL='#2a2430', SW=4, F='font-family="DejaVu Sans" font-weight="bold"';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOutBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const easeIO=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const pop=(lt,d=0,dur=.22)=>{const x=clamp((lt-d)/dur,0,1);return x<=0?0.001:easeOutBack(x)};
const lerp=(a,b,x)=>a+(b-a)*x, prog=(lt,a,b)=>easeIO(clamp((lt-a)/(b-a),0,1));
const G=(x,y,s,c,r=0)=>`<g transform="translate(${x},${y}) rotate(${r}) scale(${s})">${c}</g>`;
const P=(x,y,s,lt,d,c,r=0)=>G(x,y,s*pop(lt,d),c,r);
let defs='';
function stripes(c1,c2,ang=-25){const id='st'+(c1+c2).replace(/#/g,'');
  defs+=`<pattern id="${id}" width="70" height="70" patternUnits="userSpaceOnUse" patternTransform="rotate(${ang})"><rect width="70" height="70" fill="${c1}"/><rect width="35" height="70" fill="${c2}"/></pattern>`;
  return `<rect width="576" height="1024" fill="url(#${id})"/>`}
function baseDefs(){return `<pattern id="tile" width="96" height="96" patternUnits="userSpaceOnUse"><rect width="96" height="96" fill="#ecebf0"/><path d="M0,0H96M0,0V96" stroke="#d3d1da" stroke-width="3"/><path d="M10,70 Q40,50 60,62 T92,40" stroke="#d9d7e0" stroke-width="2" fill="none"/></pattern>
 <pattern id="wood" width="576" height="60" patternUnits="userSpaceOnUse"><rect width="576" height="60" fill="#8f8a86"/><rect y="56" width="576" height="4" fill="#77726e"/><path d="M40,20 Q120,12 200,22 M300,36 Q380,28 470,38" stroke="#a09b97" stroke-width="3" fill="none"/></pattern>
 <pattern id="mat" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#2c2a33"/><circle cx="10" cy="10" r="3" fill="#3b3944"/></pattern>`}

/* ---------- puppy (original white fluffy design) ---------- */
function cloud(pts,fill,ol=OL,w=SW){
  return pts.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r+w*.75}" fill="${ol}"/>`).join('')+pts.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`).join('');
}
function ring(cx,cy,rx,ry,n,r,j=0){const p=[[cx,cy,Math.min(rx,ry)]];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry,r+((i*7)%3)*j])}return p}
function pupHead(o={}){
  const ex=o.expr||'happy',wet=o.wet,t=o.t||0,w=Math.sin(t*5)*3,fur=wet?'#f3f1ee':'#ffffff';
  const ear=(s)=>`<g transform="scale(${s},1) rotate(${wet?-24:w})"><path d="M-58,-30 L-48,-96 L-12,-52Z" fill="${fur}" stroke="${OL}" stroke-width="${SW}" stroke-linejoin="round"/><path d="M-48,-42 L-44,-80 L-24,-52Z" fill="#f6b3c4"/></g>`;
  let eyes, mouth='';
  if(ex==='happy'||ex==='closed') eyes=[-24,24].map(x=>`<path d="M${x-11},-4 Q${x},${ex==='happy'?-16:4} ${x+11},-4" stroke="${OL}" stroke-width="5" fill="none" stroke-linecap="round"/>`).join('');
  else if(ex==='surprised') eyes=[-24,24].map(x=>`<circle cx="${x}" cy="-6" r="11" fill="#fff" stroke="${OL}" stroke-width="3"/><circle cx="${x}" cy="-6" r="5" fill="#1d1820"/>`).join('');
  else eyes=[-24,24].map(x=>`<ellipse cx="${x+(o.lx||0)*3}" cy="-6" rx="9" ry="11" fill="#1d1820"/><circle cx="${x+(o.lx||0)*3+3}" cy="-10" r="3.5" fill="#fff"/>`).join('');
  if(ex==='bite') mouth=`<path d="M-18,20 Q0,52 18,20Z" fill="#7a2a3a" stroke="${OL}" stroke-width="3"/><path d="M-14,21 l4,8 l4,-8 l4,8 l4,-8 l4,8 l4,-8" fill="#fff" stroke="${OL}" stroke-width="1.5"/>`;
  else if(ex==='happy'||ex==='tongue') mouth=`<path d="M-14,20 Q0,40 14,20Z" fill="#7a2a3a" stroke="${OL}" stroke-width="3"/><path d="M-8,27 Q-9,50 0,50 Q9,50 8,27Z" fill="#f47a8f" stroke="${OL}" stroke-width="3"/>`;
  else if(ex==='sad') mouth=`<path d="M-10,30 Q0,22 10,30" stroke="${OL}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  else if(ex==='surprised') mouth=`<ellipse cx="0" cy="30" rx="6" ry="8" fill="#7a2a3a" stroke="${OL}" stroke-width="3"/>`;
  else mouth=`<path d="M-10,22 Q-5,29 0,22 Q5,29 10,22" stroke="${OL}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  const head=wet?`<ellipse rx="56" ry="50" fill="${fur}" stroke="${OL}" stroke-width="${SW}"/>`:cloud(ring(0,0,50,42,14,18),fur);
  return `${ear(1)}${ear(-1)}${head}
   <ellipse cx="-40" cy="14" rx="9" ry="5" fill="#f6a9b8" opacity=".85"/><ellipse cx="40" cy="14" rx="9" ry="5" fill="#f6a9b8" opacity=".85"/>
   ${eyes}<ellipse cx="0" cy="10" rx="11" ry="8" fill="#1d1820"/><ellipse cx="-3" cy="7" rx="4" ry="2" fill="#fff" opacity=".7"/>${mouth}
   ${wet?`<path d="M-30,48 q4,10 0,14 q-4,-4 0,-14Z M28,46 q4,10 0,14 q-4,-4 0,-14Z" fill="#8fd0f5" stroke="${OL}" stroke-width="2"/>`:''}`;
}
function pup(o={}){
  const t=o.t||0,wet=o.wet,fur=wet?'#f3f1ee':'#ffffff',wag=o.wag?Math.sin(t*14)*14:0,bob=Math.sin(t*4)*2;
  const body=wet?`<path d="M-44,-130 C-60,-90 -60,-30 -48,-6 L48,-6 C60,-30 60,-90 44,-130Z" fill="${fur}" stroke="${OL}" stroke-width="${SW}"/>`
    :cloud(ring(0,-72,52,58,16,22,2),fur);
  const tail=wet?`<path d="M44,-50 Q90,-70 80,-120" stroke="${OL}" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M44,-50 Q90,-70 80,-120" stroke="${fur}" stroke-width="9" fill="none" stroke-linecap="round"/>`
    :cloud([[62,-70,18],[80,-96,20],[78,-126,18],[60,-140,14]],fur);
  let extra='';
  if(o.foam) extra+=cloud([[-40,-120,16],[-10,-138,20],[24,-128,18],[44,-100,14],[-48,-80,14],[0,-90,16],[30,-60,14],[-20,-46,13]],'#f4fbff','#9ccbe8',3)+G(0,-196+bob,1,cloud([[-30,-50,14],[0,-62,18],[30,-50,14]],'#f4fbff','#9ccbe8',3));
  if(o.towel) extra+=`<path d="M-70,-150 Q0,-178 70,-150 L78,-10 Q0,6 -78,-10Z" fill="#e8508f" stroke="${OL}" stroke-width="${SW}"/><path d="M-60,-120 H60 M-64,-80 H64 M-66,-40 H66" stroke="#c63c76" stroke-width="5"/>`;
  if(o.robe) extra+=`<path d="M-66,-148 Q0,-170 66,-148 L74,-8 Q0,8 -74,-8Z" fill="#e88a2e" stroke="${OL}" stroke-width="${SW}"/><circle cx="0" cy="-100" r="8" fill="#fff" stroke="${OL}" stroke-width="3"/><circle cx="0" cy="-66" r="8" fill="#fff" stroke="${OL}" stroke-width="3"/>`;
  if(o.bandana) extra+=`<path d="M-46,-146 L46,-146 L0,-100Z" fill="#d63a3a" stroke="${OL}" stroke-width="${SW}" stroke-linejoin="round"/><circle cx="-10" cy="-132" r="4" fill="#fff"/><circle cx="12" cy="-130" r="4" fill="#fff"/>`;
  let head=G(0,-178+bob,1,pupHead(o),o.tilt||0);
  if(o.robe) head=G(0,-178+bob,1,`<path d="M-72,10 Q-80,-70 0,-76 Q80,-70 72,10 Q60,40 0,44 Q-60,40 -72,10Z" fill="#e88a2e" stroke="${OL}" stroke-width="${SW}"/><circle cx="-56" cy="-62" r="18" fill="#e88a2e" stroke="${OL}" stroke-width="${SW}"/><circle cx="56" cy="-62" r="18" fill="#e88a2e" stroke="${OL}" stroke-width="${SW}"/><circle cx="-56" cy="-62" r="8" fill="#f6b3c4"/><circle cx="56" cy="-62" r="8" fill="#f6b3c4"/>`+G(0,6,.85,pupHead({...o,wet:true})),o.tilt||0);
  if(o.hat) head+=G(0,-178+bob-44,1,`<ellipse cx="0" cy="8" rx="92" ry="16" fill="#9a5b2c" stroke="${OL}" stroke-width="${SW}"/><path d="M-48,8 Q-52,-50 -20,-46 Q0,-30 20,-46 Q52,-50 48,8Z" fill="#b06c36" stroke="${OL}" stroke-width="${SW}"/><rect x="-46" y="-6" width="92" height="10" fill="#5a3418"/>`,(o.tilt||0)-6);
  return `<g transform="rotate(${wag},44,-60)">${tail}</g>${body}
   <rect x="-36" y="-56" width="28" height="54" rx="13" fill="${fur}" stroke="${OL}" stroke-width="${SW}"/><rect x="8" y="-56" width="28" height="54" rx="13" fill="${fur}" stroke="${OL}" stroke-width="${SW}"/>
   <path d="M-27,-4 v-8 M-17,-4 v-8 M17,-4 v-8 M27,-4 v-8" stroke="${OL}" stroke-width="2.5"/>${extra}${head}`;
}
function pupLying(o={}){const t=o.t||0,br=Math.sin(t*2.5)*2;
  return cloud(ring(10,-40-br,90,36,18,18),'#fff')+`<rect x="-110" y="-26" width="50" height="24" rx="12" fill="#fff" stroke="${OL}" stroke-width="${SW}"/><rect x="-66" y="-24" width="46" height="22" rx="11" fill="#fff" stroke="${OL}" stroke-width="${SW}"/>`+G(-80,-80,.8,pupHead(o))+(o.toy?G(-120,-24,.9,bone(),-15):'')}
function mattedDog(t){const p=[];for(let i=0;i<22;i++){const a=i/22*Math.PI*2;p.push([Math.cos(a)*90,-110+Math.sin(a)*90,26])}
  p.unshift([0,-110,92]);let sc='';for(let i=0;i<9;i++){const x=-60+i*15,y=-150+((i*37)%90);sc+=`<path d="M${x},${y} q10,-14 18,0 q8,14 18,0 q-6,16 -26,6" stroke="#8a8590" stroke-width="3" fill="none"/>`}
  return `<rect x="-60" y="-40" width="34" height="40" rx="14" fill="#cfcbd2" stroke="${OL}" stroke-width="${SW}"/><rect x="26" y="-40" width="34" height="40" rx="14" fill="#cfcbd2" stroke="${OL}" stroke-width="${SW}"/>`+cloud(p,'#cfcbd2')+sc+G(0,-230+Math.sin(t*20)*2,1.05,`<path d="M-58,-30 L-48,-96 L-12,-52Z" fill="#cfcbd2" stroke="${OL}" stroke-width="${SW}"/><path d="M58,-30 L48,-96 L12,-52Z" fill="#cfcbd2" stroke="${OL}" stroke-width="${SW}"/>`+cloud(ring(0,0,50,42,14,18),'#cfcbd2')+`<path d="M-36,-14 L-14,-6 M36,-14 L14,-6" stroke="${OL}" stroke-width="4"/><ellipse cx="-24" cy="2" rx="7" ry="9" fill="#1d1820"/><ellipse cx="24" cy="2" rx="7" ry="9" fill="#1d1820"/><ellipse cx="0" cy="16" rx="10" ry="7" fill="#1d1820"/><path d="M-10,34 Q0,26 10,34" stroke="${OL}" stroke-width="4" fill="none"/>`)}

/* ---------- groomer (original) ---------- */
const SK='#d9a27a';
function groomer(o={}){
  const t=o.t||0,m=o.mouth||'smile',sway=Math.sin(t*6)*8;
  let mouth=m==='laugh'?`<path d="M-16,-196 Q0,-170 16,-196Z" fill="#7a2a3a" stroke="${OL}" stroke-width="3"/>`
    :m==='stern'?`<path d="M-12,-190 H12" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`
    :m==='o'?`<ellipse cx="0" cy="-190" rx="7" ry="9" fill="#7a2a3a" stroke="${OL}" stroke-width="3"/>`
    :`<path d="M-14,-196 Q0,-182 14,-196" stroke="${OL}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  const brows=m==='stern'?`<path d="M-30,-238 L-10,-232 M30,-238 L10,-232" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`:`<path d="M-30,-236 Q-20,-242 -10,-236 M30,-236 Q20,-242 10,-236" stroke="${OL}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  const eyes=m==='laugh'?`<path d="M-28,-220 Q-20,-230 -12,-220 M28,-220 Q20,-230 12,-220" stroke="${OL}" stroke-width="4" fill="none" stroke-linecap="round"/>`:`<ellipse cx="-20" cy="-220" rx="5" ry="6.5" fill="#1d1820"/><ellipse cx="20" cy="-220" rx="5" ry="6.5" fill="#1d1820"/>`;
  const armR=o.hand?(()=>{const [hx,hy]=o.hand;return `<path d="M52,-118 Q${(52+hx)/2+30},${(-118+hy)/2+20} ${hx},${hy}" stroke="${OL}" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M52,-118 Q${(52+hx)/2+30},${(-118+hy)/2+20} ${hx},${hy}" stroke="${SK}" stroke-width="22" fill="none" stroke-linecap="round"/><circle cx="${hx}" cy="${hy}" r="17" fill="${SK}" stroke="${OL}" stroke-width="${SW}"/>${G(hx,hy,1,o.item||'',o.itemRot||0)}`})():'';
  const armL=o.hand2?(()=>{const [hx,hy]=o.hand2;return `<path d="M-52,-118 Q${(-52+hx)/2-30},${(-118+hy)/2+20} ${hx},${hy}" stroke="${OL}" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M-52,-118 Q${(-52+hx)/2-30},${(-118+hy)/2+20} ${hx},${hy}" stroke="${SK}" stroke-width="22" fill="none" stroke-linecap="round"/><circle cx="${hx}" cy="${hy}" r="17" fill="${SK}" stroke="${OL}" stroke-width="${SW}"/>${G(hx,hy,1,o.item2||'')}`})():'';
  return `<g transform="rotate(${sway},0,-250)"><path d="M10,-268 Q60,-262 70,-200 Q78,-130 50,-110 Q56,-170 30,-230Z" fill="#2a1f22" stroke="${OL}" stroke-width="3"/></g>
  <path d="M-80,0 L-80,-100 Q-80,-150 -30,-152 L30,-152 Q80,-150 80,-100 L80,0Z" fill="#26232b" stroke="${OL}" stroke-width="${SW}"/>
  <path d="M-46,0 L-46,-110 L46,-110 L46,0Z" fill="#3b3640" stroke="${OL}" stroke-width="3"/><path d="M-46,-110 L-30,-150 M46,-110 L30,-150" stroke="#55505a" stroke-width="5"/>
  <rect x="-14" y="-168" width="28" height="22" fill="${SK}" stroke="${OL}" stroke-width="3"/>
  <circle cx="0" cy="-214" r="48" fill="${SK}" stroke="${OL}" stroke-width="${SW}"/>
  <path d="M-50,-214 Q-54,-272 0,-272 Q54,-272 50,-214 Q40,-248 0,-250 Q-30,-250 -50,-214Z" fill="#2a1f22" stroke="${OL}" stroke-width="3"/>
  ${brows}${eyes}<path d="M0,-212 q-5,10 2,12" stroke="${OL}" stroke-width="3" fill="none" stroke-linecap="round"/>${mouth}
  <ellipse cx="-34" cy="-200" rx="8" ry="5" fill="#e88a8a" opacity=".6"/><ellipse cx="34" cy="-200" rx="8" ry="5" fill="#e88a8a" opacity=".6"/>
  ${o.sweat?`<path d="M54,-250 q8,14 0,20 q-8,-6 0,-20Z" fill="#8fd0f5" stroke="${OL}" stroke-width="2.5"/>`:''}${armL}${armR}`;
}

/* ---------- environments ---------- */
function bathroom(){return `<rect width="576" height="1024" fill="url(#tile)"/>
  <g stroke="${OL}" stroke-width="${SW}"><rect x="380" y="300" width="14" height="140" fill="#2c2a33"/><path d="M394,310 H450 Q470,310 470,330 V360" fill="none" stroke-width="12"/><rect x="450" y="356" width="40" height="18" rx="6" fill="#2c2a33"/></g>
  <rect y="880" width="576" height="144" fill="#d9d4cf"/>`}
function tub(front=true){return front?`<path d="M20,640 H556 V900 Q556,940 516,940 H60 Q20,940 20,900Z" fill="#ef5ba1" stroke="${OL}" stroke-width="${SW}"/><rect x="40" y="650" width="496" height="16" rx="8" fill="#f78cbf"/><circle cx="470" cy="760" r="36" fill="#d94a8c" stroke="${OL}" stroke-width="${SW}"/>`
  :`<rect x="20" y="560" width="536" height="100" fill="url(#mat)" stroke="${OL}" stroke-width="${SW}"/>`}
function salon(){return `<rect width="576" height="1024" fill="url(#wood)"/>
  <rect x="380" y="60" width="170" height="260" fill="#cfe9f5" stroke="${OL}" stroke-width="${SW}"/><path d="M465,60 V320 M380,190 H550" stroke="${OL}" stroke-width="3"/>
  <g stroke="${OL}" stroke-width="${SW}"><rect x="60" y="80" width="12" height="560" fill="#b9b6bd"/><rect x="60" y="80" width="200" height="12" fill="#b9b6bd"/></g>
  <path d="M250,92 Q246,300 262,420" stroke="#4b3a7a" stroke-width="8" fill="none"/>`}
function gtable(){return `<rect x="0" y="880" width="576" height="144" fill="#d9d4cf"/>
  <rect x="120" y="740" width="22" height="160" fill="#b9b6bd" stroke="${OL}" stroke-width="${SW}"/><rect x="434" y="740" width="22" height="160" fill="#b9b6bd" stroke="${OL}" stroke-width="${SW}"/>
  <rect x="-10" y="620" width="596" height="120" rx="10" fill="#f0a3c6" stroke="${OL}" stroke-width="${SW}"/><rect x="-10" y="620" width="596" height="22" rx="10" fill="#f6bcd6" stroke="${OL}" stroke-width="3"/>`}

/* ---------- props ---------- */
const duckBottle=()=>`<rect x="-30" y="0" width="60" height="96" rx="12" fill="#f4f6fb" stroke="${OL}" stroke-width="${SW}"/><rect x="-30" y="34" width="60" height="30" fill="#ffd23a"/>
  <circle cx="0" cy="-22" r="26" fill="#ffd23a" stroke="${OL}" stroke-width="${SW}"/><path d="M-28,-22 L-52,-16 L-28,-10Z" fill="#f58a1f" stroke="${OL}" stroke-width="3"/><circle cx="-8" cy="-28" r="4" fill="${OL}"/>`;
const bottle=(c='#fdf3d0',lab='#4a7fd6')=>`<rect x="-32" y="-60" width="64" height="120" rx="14" fill="${c}" stroke="${OL}" stroke-width="${SW}"/><rect x="-14" y="-82" width="28" height="24" rx="5" fill="#fff" stroke="${OL}" stroke-width="${SW}"/><rect x="-24" y="-20" width="48" height="40" rx="6" fill="${lab}"/>`;
const shower=(t)=>`<rect x="-14" y="-90" width="28" height="90" rx="10" fill="#2c2a33" stroke="${OL}" stroke-width="3"/><ellipse cx="0" cy="-96" rx="34" ry="14" fill="#3b3944" stroke="${OL}" stroke-width="3"/>`+[-20,-8,4,16].map((x,i)=>`<line x1="${x}" y1="${-110-((t*300+i*20)%30)}" x2="${x*2.2}" y2="${-200-((t*300+i*20)%30)}" stroke="#7cc6f5" stroke-width="5" stroke-linecap="round"/>`).join('');
const brush=()=>`<rect x="-8" y="0" width="16" height="80" rx="8" fill="#d63a3a" stroke="${OL}" stroke-width="${SW}"/><rect x="-40" y="-40" width="80" height="44" rx="10" fill="#d63a3a" stroke="${OL}" stroke-width="${SW}"/>${[-30,-18,-6,6,18,30].map(x=>`<line x1="${x}" y1="-40" x2="${x}" y2="-54" stroke="${OL}" stroke-width="3"/>`).join('')}`;
const dryer=(t)=>`<path d="M-20,-30 L80,-24 L80,24 L-20,30Z" fill="#2c2a33" stroke="${OL}" stroke-width="${SW}"/><rect x="-60" y="-20" width="44" height="40" rx="8" fill="#2c2a33" stroke="${OL}" stroke-width="${SW}"/>`+[ -16,0,16].map((y,i)=>`<path d="M${96+((t*400+i*30)%60)},${y} q14,-8 28,0 t28,0" stroke="#bfe3f7" stroke-width="5" fill="none" stroke-linecap="round"/>`).join('');
const clipper=()=>`<rect x="-20" y="-60" width="40" height="110" rx="18" fill="#2bb3c7" stroke="${OL}" stroke-width="${SW}"/><rect x="-22" y="-74" width="44" height="18" rx="4" fill="#cfd6df" stroke="${OL}" stroke-width="3"/><circle cx="0" cy="0" r="7" fill="#fff"/>`;
const bone=()=>`<g fill="#3a8fe0" stroke="${OL}" stroke-width="${SW}"><circle cx="-48" cy="-14" r="18"/><circle cx="-48" cy="14" r="18"/><circle cx="48" cy="-14" r="18"/><circle cx="48" cy="14" r="18"/><rect x="-50" y="-14" width="100" height="28"/></g><rect x="-46" y="-11" width="92" height="22" fill="#3a8fe0"/>`;
const spray=()=>`<rect x="-26" y="-30" width="52" height="96" rx="12" fill="#f07bb0" stroke="${OL}" stroke-width="${SW}"/><rect x="-10" y="-56" width="20" height="28" fill="#fff" stroke="${OL}" stroke-width="3"/><path d="M-10,-56 H-36 V-44 H-10" fill="#fff" stroke="${OL}" stroke-width="3"/>`;
const sparkle=(c='#f7d22c')=>`<path d="M0,-18 Q3,-3 18,0 Q3,3 0,18 Q-3,3 -18,0 Q-3,-3 0,-18Z" fill="${c}" stroke="${OL}" stroke-width="2.5"/>`;
const heart=(c='#f0506e')=>`<path d="M0,18 C-30,-4 -26,-30 -12,-30 C-4,-30 0,-22 0,-18 C0,-22 4,-30 12,-30 C26,-30 30,-4 0,18Z" fill="${c}" stroke="${OL}" stroke-width="3"/>`;
const txt=(s,size=80,c='#f7d22c')=>`<text text-anchor="middle" ${F} font-size="${size}" fill="${c}" stroke="${OL}" stroke-width="${size/13}" paint-order="stroke">${s}</text>`;
const bigX=()=>`<path d="M-60,-60 L60,60 M60,-60 L-60,60" stroke="#e23a3a" stroke-width="22" stroke-linecap="round"/>`;
const check=()=>`<path d="M-50,0 L-14,36 L56,-40" stroke="#3cb34a" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
function calendar(inner=''){return `<rect x="-70" y="-56" width="140" height="140" rx="12" fill="#fff" stroke="${OL}" stroke-width="${SW}"/><path d="M-70,-44 Q-70,-56 -58,-56 L58,-56 Q70,-56 70,-44 L70,-20 L-70,-20Z" fill="#e2453b" stroke="${OL}" stroke-width="${SW}"/>${inner}`}
function phone(t,lt){return `<rect x="-90" y="-170" width="180" height="340" rx="26" fill="#2c2a33" stroke="${OL}" stroke-width="${SW}"/><rect x="-76" y="-150" width="152" height="300" rx="12" fill="#f4f1fa"/>`

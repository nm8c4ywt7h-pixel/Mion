const SEG=TL.segs,LN=S.lines,ID=LN.map(l=>l.id);const idx=id=>ID.indexOf(id);
const segAt=t=>{let s=0;for(let i=0;i<SEG.length;i++)if(t>=SEG[i].start-0.14)s=i;return s;};

function chunkW(i){const l=LN[i].subs.map(s=>s.replace(/[*~]/g,'').length+4);const T=l.reduce((a,b)=>a+b,0);return l.map(x=>x/T);}
function chunkStart(i,k){const w=chunkW(i);let a=0;for(let j=0;j<k;j++)a+=w[j];return SEG[i].start+a*(SEG[i].end-SEG[i].start);}
function chunkAt(i,t){const w=chunkW(i);const p=clamp((t-SEG[i].start)/(SEG[i].end-SEG[i].start));let a=0;for(let k=0;k<w.length;k++){a+=w[k];if(p<=a||k===w.length-1)return k;}}

const PIPO0=V(0,0,0);
function pipoPos(id){if(id==='door')return [V(1.0,0,-10.2),Math.PI*0.92];if(id==='night')return [V(15.6,0,-3.4),-0.9];return [PIPO0,0];}
function camFor(id,p,k){
  switch(id){
  case 'hook':return [V(0.3,lerp(1.5,1.35,p),lerp(5.6,4.6,p)),V(0,1.25,0)];
  case 'alone':return [V(lerp(2,4,p),lerp(9,13,p),lerp(10,15,p)),V(0,0.5,-2)];
  case 'door':return [V(lerp(-4.2,-3.6,p),lerp(2.6,2.4,p),lerp(-20,-19,p)),V(0.6,1.2,-10.2)];
  case 'ball':return [V(lerp(6,5.4,p),lerp(2.2,2.0,p),lerp(9,8.4,p)),V(1.0,0.8,2.4)];
  case 'night':return [V(lerp(22,21,p),lerp(4.2,3.8,p),lerp(4.5,3.5,p)),V(15.4,1.0,-4)];
  case 'idea':return [V(-1.0,lerp(2.8,2.6,p),lerp(10,9,p)),V(-1.2,2.6,0)];
  case 'change':return [V(-2.4,2.9,lerp(7.6,6.4,ease(p))),V(-2.4,2.9,0)];
  case 'rule':return [V(lerp(4,5,p),lerp(5,6,p),lerp(9,10,p)),V(0,0.5,-5)];
  case 'breeds':return [V(lerp(5.2,4.6,p),lerp(2.0,1.8,p),lerp(-5.5,-6.0,p)),V(-0.3,0.7,-8)];
  case 'houses':return [V(lerp(8,7,p),lerp(25,23,p),lerp(23,21,p)),V(1,0,1)];
  case 'special':return k<3?[V(lerp(4,3,p),lerp(26,24,p),lerp(32,30,p)),V(7,0,9)]:[V(lerp(6,4,p),lerp(24,22,p),lerp(31,29,p)),V(7,0,9)];
  case 'team':{const who=[paco,lola,carmen][LN[idx('team')].chunkShot[k]];const x=who.position.x;return [V(x+0.4,2.4,TEAMZ+lerp(8.8,8.0,p)),V(x,1.85,TEAMZ)];}
  case 'secret':return k<3?[V(lerp(19,17,p),lerp(9,10,p),lerp(6,4,p)),V(5,4,-15)]:[V(lerp(16,14,p),lerp(13,14,p),lerp(10,8,p)),V(0,7,-20)];
  case 'party':return [V(Math.sin(p*0.8)*3,lerp(2.4,2.8,p),lerp(8.5,7.5,p)),V(-0.8,2.0,0)];
  case 'vote':return [V(lerp(-5,-6,p),lerp(54,50,p),lerp(30,27,p)),V(-15,0,-8)];
  case 'comment':return [V(-6,lerp(50,47,p),lerp(27,25,p)),V(-15,0,-8)];
  case 'remember':return [V(lerp(0.2,-0.4,p),lerp(9.5,8.8,p),lerp(21,19.5,p)),V(-3.4,1.0,2.8)];
  case 'thanks':{const a=-0.6+p*1.2;return [V(Math.sin(a)*7.5,2.6,Math.cos(a)*7.5),V(-0.6,1.3,0)];}
  default:return [V(0,lerp(2.4,2.2,p),lerp(7.8,7.0,p)),V(0,1.6,-0.5)];}
}
window.renderAt=function(t){
  const si=segAt(t);const id=ID[si];const [s0,s1]=segBounds(si);const p=clamp((t-s0)/(s1-s0));const L=LN[si];
  const k=chunkAt(si,Math.max(t,SEG[si].start));
  let p2=p;if(id==='secret'||id==='special'){const sp=id==='secret'?3:3;const ks=k<sp?s0:chunkStart(si,sp);const ke=k<sp?chunkStart(si,sp):s1;p2=clamp((t-ks)/(ke-ks));}
  if(id==='team'){const sh=L.chunkShot;let a=k;while(a>0&&sh[a-1]===sh[k])a--;let b=k;while(b<sh.length-1&&sh[b+1]===sh[k])b++;const ks=a===0?s0:chunkStart(si,a);const ke=b===sh.length-1?s1:chunkStart(si,b+1);p2=clamp((t-ks)/(ke-ks));}
  const [cp,ct]=camFor(id,p2,k);cam.position.copy(cp);cam.lookAt(ct);cam.updateMatrixWorld();
  const iIdea=idx('idea');
  // mood

  const sunnyK=si<iIdea?0:(id==='idea'?ease(clamp((t-s0)/0.8)):1);
  const greyC=new THREE.Color('#7d8a99');
  if(night){const nk=id==='party'?ease(clamp((t-s0)/0.4)):1;scene.background.copy(SKY).lerp(NIGHT,nk);scene.fog.color.set('#bfe6ff').lerp(NIGHT,nk);hemi.intensity=lerp(1.6,0.45,nk);sun.intensity=lerp(2.2,0.35,nk);}
  else{const g=overcast?0.7:(id==='idea'?0.7*(1-sunnyK):0);scene.background.copy(SKY).lerp(greyC,g);scene.fog.color.set('#bfe6ff').lerp(new THREE.Color('#8c97a5'),g);sun.intensity=lerp(2.2,0.9,g/0.7);hemi.intensity=lerp(1.6,1.1,g/0.7);}
  if(id==='thanks'){scene.background.set('#ffb98a').lerp(SKY,0.35);sun.color.set('#ffcf9a');}else sun.color.set('#fff4dc');
  beams.forEach((b,i)=>{b.visible=id==='party';b.rotation.z=(i-2.5)*0.12+Math.sin(t*1.5+i)*0.15;});
  // pipo
  const [pp,pr]=pipoPos(id);pipo.position.copy(pp);pipo.rotation.set(0,pr,0);
  const sad=si<iIdea;
  pcloud.visible=rainy;pcloud.position.set(pp.x,3.1,pp.z);prain.visible=rainy;
  if(prain.visible){for(let i=0;i<prN;i++){const [x,z,o]=prSeed[i];const y=2.9-((t*6+o*2.9)%2.9);prPos.set([pp.x+x,y,pp.z+z,pp.x+x,y-0.3,pp.z+z],i*6);}prG.attributes.position.needsUpdate=true;}
  tear.visible=sad&&id!=='night';tear.position.y=0.92-((t*0.5)%0.25);
  ears.forEach((e,i)=>{e.rotation.z=(i?1:-1)*(sad?0.9:0.3);});
  pipo.userData.tail.rotation.y=sad?Math.sin(t*2)*0.1:Math.sin(t*22)*0.7;
  const jump=id==='follow'||id==='party'||id==='thanks';
  pipo.position.y=sad?0:Math.abs(Math.sin(t*(jump?7:4)))*(jump?0.5:0.12);
  if(id==='night'){pipo.position.y=-0.12;pipo.rotation.x=0;}
  if(id==='ball'){const bp=clamp((t-ballT0)/1.6);pipo.rotation.y=lerp(0,-0.35,ease(bp));}
  hat.visible=si>=idx('party');
  // ball
  ball.visible=id==='ball';if(ball.visible){const bp=ease(clamp((t-ballT0)/1.6));ball.position.set(lerp(0.4,2.6,bp),0.28,lerp(1.6,7.5,bp));ball.rotation.x=bp*20;}

  bulb.visible=id==='idea'&&t>ideaT;if(bulb.visible){bulb.scale.setScalar(pop((t-ideaT)/0.35));bulb.userData.glow.lookAt(cam.position);bulb.userData.glow.rotation.z=t;}
  if(id==='idea'){M.aR.rotation.z=2.5;M.head.rotation.z=0.1;}
  if(id==='change'){const a=ease(clamp(p*2.5));M.aR.rotation.x=-a*1.45;M.aR.rotation.z=0.15-a*0.35;}
  if(id==='party'||id==='thanks'){M.aR.rotation.z=2.8;M.aL.rotation.z=-2.8;}
  if(id==='follow'){M.aR.rotation.z=2.6+Math.sin(t*9)*0.35;}
  // team
  const teamOn=id==='team';[lola,carmen,...cats].forEach(o=>o.visible=teamOn);lola.userData.head.rotation.z=Math.sin(t*30)*0.06;lola.position.x=Math.sin(t*40)*0.03;

    g.position.set(lerp(r.sx,r.tx,ease(kk)),0,lerp(r.sz,r.tz,kk));const run=kk<1;g.rotation.y=run?0:Math.atan2(-g.position.x,-g.position.z)+Math.sin(t*2+r.ph)*0.3;

  breedRunners.forEach((b,i)=>{const g=b.g;const on=si>=idx('breeds')&&t>breedT[i]&&!(id==='team'||id==='secret');g.visible=on;if(!on)return;
    const kk=clamp((t-breedT[i])/0.9);g.position.set(lerp(b.lane,b.stopX,kk),0,lerp(-24,b.stopZ,ease(kk)));g.rotation.y=kk<1?0:Math.PI*0.95;
    g.position.y=kk<1?Math.abs(Math.sin(t*18+i))*0.15:Math.abs(Math.sin(t*5+i))*0.06;g.userData.tail.rotation.y=Math.sin(t*20+i)*0.6;});

  houses.forEach((h,i)=>{const s=(id==='remember'&&i===1)?0:si>=idx('houses')?pop((t-houseT[i])/0.35)*0.95:0;h.scale.setScalar(Math.max(s,0.0001));h.userData.pup.userData.tail.rotation.y=Math.sin(t*20+i)*0.6;});

  // ---- UI

    $('topB').style.color=L.topColor||'#ffc928';const ts=(L.chunkTop&&L.chunkTop[k]&&!L.chunkTop[k-1])?chunkStart(si,k):s0;$('top').style.transform=`scale(${0.6+0.4*pop((t-ts)/0.25)})`;}

  voteEls.forEach((d,i)=>{const on=(id==='vote'&&t>voteT[i])||id==='comment';d.style.display=on?'block':'none';if(!on)return;const [x,y]=project(V(votePlots[i][0],i===2?11:5.8,votePlots[i][1]));
    d.style.left=x+'px';d.style.top=y+'px';d.style.transform=`translate(-50%,-50%) scale(${id==='comment'?1+0.08*Math.sin(t*8+i):pop((t-voteT[i])/0.3)})`;});
  show('result',id==='comment');if(id==='comment'){$('rfill').style.width=(ease(p)*100)+'%';}

  show('btn',id==='follow');if(id==='follow'){const done=t>subT;$('btn').textContent=done?U.following+' ✓':U.follow;$('btn').style.background=done?'#8c8f99':'#ff2d55';
    const pr=done?pop((t-subT)/0.3):pop((t-s0)/0.3);$('btn').style.transform=`translate(-50%,-50%) scale(${pr*((t>subT-0.12&&t<subT)?0.9:1)})`;}
  const confStart=id==='party'?partyT+0.3:subT;
  confEls.forEach(c=>{const ct=t-confStart-c.dl;const on=(id==='follow'||id==='party')&&ct>0;c.d.style.display=on?'block':'none';if(!on)return;c.d.style.left=(c.x+Math.sin(ct*3+c.r)*40)+'px';c.d.style.top=(-60+c.v*((ct)%4))+'px';c.d.style.transform=`rotate(${c.r+ct*300*c.w}deg)`;});
  const hs=id==='change'?s0+0.3:(id==='thanks'?s0+0.2:1e9);
  heartEls.forEach(h=>{const ct=t-hs-h.dl;const on=(id==='change'||id==='thanks')&&ct>0;h.d.style.display=on?'block':'none';if(!on)return;h.d.style.left=h.x+'px';h.d.style.top=(1150-h.v*ct)+'px';h.d.style.opacity=clamp(1.6-ct*0.6);h.d.style.transform=`scale(${pop(ct/0.3)})`;});
  starEls.forEach((s,i)=>{const on=(id==='night'||id==='party')&&t>s0+0.1+i*0.05;s.d.style.display=on?'block':'none';if(on){s.d.style.left=s.x+'px';s.d.style.top=s.y+'px';s.d.style.transform=`scale(${s.s*(0.8+0.2*Math.sin(t*5+i))})`;}});
  renderer.render(scene,cam);
};

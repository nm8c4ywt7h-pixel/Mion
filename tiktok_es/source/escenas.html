<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}svg{display:block}</style>
</head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="576" height="1024" viewBox="0 0 576 1024"></svg>
<script>
const OL='#2a1c14', SW=4, BR='#c8793a', DK='#7a4220', WH='#ffffff';
const F='font-family="DejaVu Sans" font-weight="bold"';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOutBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const easeIO=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function pop(lt,d=0,dur=.22){const x=clamp((lt-d)/dur,0,1);return x<=0?0.001:easeOutBack(x)}
function lerp(a,b,x){return a+(b-a)*x}
function prog(lt,a,b){return easeIO(clamp((lt-a)/(b-a),0,1))}
const G=(x,y,s,c,r=0)=>`<g transform="translate(${x},${y}) rotate(${r}) scale(${s})">${c}</g>`;
const P=(x,y,s,lt,d,c)=>G(x,y,s*pop(lt,d),c);

/* ---------- backgrounds ---------- */
let defs='';
function stripes(c1,c2,ang=-25){
  const id='st'+(c1+c2).replace(/#/g,'');
  defs+=`<pattern id="${id}" width="70" height="70" patternUnits="userSpaceOnUse" patternTransform="rotate(${ang})"><rect width="70" height="70" fill="${c1}"/><rect width="35" height="70" fill="${c2}"/></pattern>`;
  return `<rect width="576" height="1024" fill="url(#${id})"/>`;
}
function baseDefs(){
  return `<pattern id="ging" width="26" height="26" patternUnits="userSpaceOnUse"><rect width="26" height="26" fill="#fff"/><rect width="13" height="26" fill="#f39aac" opacity=".55"/><rect width="26" height="13" fill="#f39aac" opacity=".55"/></pattern>
  <pattern id="wall" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#f8e6b8"/><rect width="20" height="40" fill="#f3d99c"/></pattern>
  <pattern id="tiles" width="64" height="40" patternUnits="userSpaceOnUse"><rect width="64" height="40" fill="#efdcc0"/><path d="M0,0H64M0,0V40" stroke="#d6bf9c" stroke-width="3"/></pattern>
  <radialGradient id="spot" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#d8c8ff" stop-opacity=".55"/><stop offset="1" stop-color="#d8c8ff" stop-opacity="0"/></radialGradient>`;
}
function room(){
  return `<rect width="576" height="1024" fill="url(#wall)"/>
  <rect y="760" width="576" height="264" fill="#b98656"/><rect y="756" width="576" height="10" fill="#8d5f37"/>
  <g stroke="${OL}" stroke-width="${SW}">
   <rect x="210" y="50" width="156" height="200" fill="#9fd3f5"/>
   <path d="M210,210 Q260,170 300,200 Q340,180 366,200 V250 H210Z" fill="#6b5fb5"/>
   <line x1="288" y1="50" x2="288" y2="250"/><rect x="200" y="36" width="176" height="16" rx="4" fill="#8d5f37"/>
   <path d="M196,50 H236 Q230,160 244,262 H196Z" fill="#e23a3a"/><path d="M380,50 H340 Q346,160 332,262 H380Z" fill="#e23a3a"/>
   <rect x="40" y="90" width="80" height="80" fill="#fff6e0"/><rect x="460" y="80" width="84" height="84" fill="#7a5fc7"/>
   <rect x="470" y="90" width="64" height="64" fill="#bfe6ff"/>
   <line x1="500" y1="330" x2="500" y2="560" stroke-width="6"/><path d="M472,330 L528,330 L516,290 L484,290Z" fill="#f2c94c"/>
   <ellipse cx="500" cy="560" rx="24" ry="7" fill="#555"/>
  </g>
  <circle cx="502" cy="122" r="14" fill="#f5b942"/><path d="M470,154 L492,128 L512,148 L522,138 L534,154Z" fill="#5fae5a"/>
  ${G(80,140,.32,dogHead({expr:'happy'}))}`;
}
function table(y=600,h=240){
  return `<rect x="-10" y="${y}" width="596" height="${h}" fill="url(#ging)" stroke="${OL}" stroke-width="${SW}"/>
  <rect x="-10" y="${y-14}" width="596" height="18" fill="#fff" stroke="${OL}" stroke-width="${SW}"/>`;
}
function underTable(){
  let legs='';
  const L=[[150,'#3c5bb0'],[262,'#2d3550'],[378,'#3c5bb0'],[480,'#4b6fd0']];
  for(const [x,c] of L){for(const dx of [-22,22]){
    legs+=`<rect x="${x+dx-17}" y="430" width="34" height="370" rx="17" fill="${c}" stroke="${OL}" stroke-width="${SW}"/>
    <ellipse cx="${x+dx}" cy="800" rx="26" ry="14" fill="${c==='#2d3550'?'#222':'#fff'}" stroke="${OL}" stroke-width="${SW}"/>`;}
    legs+=`<ellipse cx="${x}" cy="440" rx="50" ry="26" fill="${c}" stroke="${OL}" stroke-width="${SW}"/>`;}
  return `<rect width="576" height="1024" fill="#5b3d2a"/>
  <rect y="790" width="576" height="234" fill="url(#tiles)"/>
  <rect width="576" height="130" fill="#6e4529"/><rect y="120" width="576" height="14" fill="#4a2e1b"/>
  <g stroke="${OL}" stroke-width="${SW}"><ellipse cx="70" cy="520" rx="52" ry="18" fill="#b46ad8"/><rect x="62" y="530" width="16" height="270" fill="#9a55bd"/></g>
  ${legs}
  <rect x="-6" y="-6" width="66" height="820" fill="url(#ging)" stroke="${OL}" stroke-width="${SW}"/>
  <rect x="516" y="-6" width="66" height="820" fill="url(#ging)" stroke="${OL}" stroke-width="${SW}"/>`;
}
function spotlight(){
  return stripes('#3b2a8a','#34247c',0)+`<path d="M220,-10 L356,-10 L470,1030 L106,1030Z" fill="url(#spot)"/>`;
}
function kitchen(){
  return `<rect width="576" height="1024" fill="#fbf3d2"/>
  <rect y="330" width="576" height="200" fill="#f4e7b0" stroke="${OL}" stroke-width="${SW}"/>
  <g stroke="${OL}" stroke-width="3" fill="none"><line x1="144" y1="330" x2="144" y2="530"/><line x1="288" y1="330" x2="288" y2="530"/><line x1="432" y1="330" x2="432" y2="530"/></g>
  <rect y="530" width="576" height="20" fill="#e2d39a" stroke="${OL}" stroke-width="${SW}"/>
  <rect y="550" width="576" height="474" fill="#f6e7c8"/>
  ${(()=>{let s='';for(let i=0;i<10;i++)for(let j=0;j<8;j++)if((i+j)%2)s+=`<rect x="${i*60}" y="${560+j*60}" width="60" height="60" fill="#ecd29e"/>`;return s})()}`;
}

/* ---------- dog (original beagle design) ---------- */
function eye(cx,cy,ex,lx,ly,side){
  const brow=(inn,out)=>`<path d="M${cx+side*16},${cy+out} Q${cx},${cy+Math.min(inn,out)-6} ${cx-side*14},${cy+inn}" stroke="${OL}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  if(ex==='happy'||ex==='tongueHappy') return `<path d="M${cx-13},${cy+4} Q${cx},${cy-13} ${cx+13},${cy+4}" stroke="${OL}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if(ex==='sleep') return `<path d="M${cx-13},${cy-2} Q${cx},${cy+9} ${cx+13},${cy-2}" stroke="${OL}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if(ex==='plead'||ex==='worried'||ex==='sad'){
    const r=ex==='sad'?15:18, pr=ex==='sad'?10:13;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${OL}" stroke-width="3.5"/>
    <circle cx="${cx+lx*4}" cy="${cy+ly*4-(ex==='sad'?-3:3)}" r="${pr}" fill="#1d1410"/>
    <circle cx="${cx+lx*4+4}" cy="${cy+ly*4-8}" r="5" fill="#fff"/><circle cx="${cx+lx*4-4}" cy="${cy+ly*4+2}" r="2.5" fill="#fff"/>
    ${brow(-34,-24)}`;
  }
  if(ex==='bored') return `<circle cx="${cx}" cy="${cy}" r="15" fill="#fff" stroke="${OL}" stroke-width="3.5"/><circle cx="${cx+lx*4}" cy="${cy+5}" r="9" fill="#1d1410"/>
    <path d="M${cx-16.5},${cy+1} A16.5 16.5 0 0 1 ${cx+16.5},${cy+1}Z" fill="${BR}" stroke="${OL}" stroke-width="3.5"/>`;
  if(ex==='surprised') return `<circle cx="${cx}" cy="${cy}" r="17" fill="#fff" stroke="${OL}" stroke-width="3.5"/><circle cx="${cx+lx*4}" cy="${cy+ly*4}" r="6" fill="#1d1410"/>`;
  return `<circle cx="${cx}" cy="${cy}" r="15" fill="#fff" stroke="${OL}" stroke-width="3.5"/><circle cx="${cx+lx*4}" cy="${cy+ly*4}" r="10" fill="#1d1410"/><circle cx="${cx+lx*4+3.5}" cy="${cy+ly*4-4}" r="3.5" fill="#fff"/>`;
}
function dogHead(o={}){
  const ex=o.expr||'neutral',lx=o.lx||0,ly=o.ly||0,t=o.t||0,w=Math.sin(t*5)*4;
  const ear=`<path d="M-50,-36 C-92,-30 -98,34 -80,64 C-68,82 -44,70 -42,42 C-40,10 -38,-20 -50,-36Z" fill="${DK}" stroke="${OL}" stroke-width="${SW}"/>`;
  let mouth;
  if(ex==='happy'||ex==='tongue'||ex==='tongueHappy') mouth=`<path d="M-15,24 Q0,46 15,24Z" fill="#5a1e1e" stroke="${OL}" stroke-width="3"/><path d="M-9,32 Q-10,58 0,58 Q10,58 9,32Z" fill="#f26d7d" stroke="${OL}" stroke-width="3"/><line x1="0" y1="38" x2="0" y2="52" stroke="#c94a5a" stroke-width="2.5"/>`;
  else if(ex==='plead'||ex==='sad'||ex==='worried') mouth=`<path d="M-11,34 Q0,24 11,34" stroke="${OL}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  else if(ex==='bored') mouth=`<line x1="-10" y1="30" x2="10" y2="30" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
  else if(ex==='surprised') mouth=`<ellipse cx="0" cy="33" rx="6" ry="8" fill="#5a1e1e" stroke="${OL}" stroke-width="3"/>`;
  else if(ex==='sleep') mouth=`<path d="M-8,28 Q0,33 8,28" stroke="${OL}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  else mouth=`<path d="M-11,25 Q-5,32 0,25 Q5,32 11,25" stroke="${OL}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  return `<ellipse cx="0" cy="0" rx="64" ry="56" fill="${BR}" stroke="${OL}" stroke-width="${SW}"/>
  <path d="M-9,-55 Q0,-58 9,-55 L15,-6 Q32,8 34,26 L-34,26 Q-32,8 -15,-6Z" fill="#fff"/>
  <ellipse cx="0" cy="28" rx="40" ry="26" fill="#fff"/>
  <ellipse cx="-42" cy="18" rx="9" ry="5" fill="#f29aa0" opacity=".8"/><ellipse cx="42" cy="18" rx="9" ry="5" fill="#f29aa0" opacity=".8"/>
  ${eye(-25,-8,ex,lx,ly,-1)}${eye(25,-8,ex,lx,ly,1)}
  <ellipse cx="0" cy="12" rx="13" ry="9" fill="#1d1410"/><ellipse cx="-4" cy="9" rx="4" ry="2.5" fill="#fff" opacity=".7"/>
  ${mouth}
  <g transform="rotate(${8+w},-50,-36)">${ear}</g><g transform="scale(-1,1)"><g transform="rotate(${8-w},-50,-36)">${ear}</g></g>
  ${ex==='worried'?`<path d="M58,-40 q8,14 0,20 q-8,-6 0,-20Z" fill="#7cc8f5" stroke="${OL}" stroke-width="2.5"/><path d="M-62,-30 q7,12 0,17 q-7,-5 0,-17Z" fill="#7cc8f5" stroke="${OL}" stroke-width="2.5"/>`:''}`;
}
function dog(o={}){
  const t=o.t||0, a=o.wag?Math.sin(t*14)*16:0, bob=Math.sin(t*4)*2;
  return `<g transform="rotate(${a},48,-40)"><path d="M48,-40 Q96,-62 92,-122" stroke="${OL}" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M48,-40 Q96,-62 92,-122" stroke="${BR}" stroke-width="11" fill="none" stroke-linecap="round"/><circle cx="92" cy="-120" r="6" fill="#fff"/></g>
  <ellipse cx="-50" cy="-22" rx="32" ry="24" fill="${BR}" stroke="${OL}" stroke-width="${SW}"/><ellipse cx="50" cy="-22" rx="32" ry="24" fill="${BR}" stroke="${OL}" stroke-width="${SW}"/>
  <path d="M-48,-142 C-72,-100 -72,-30 -55,-6 L55,-6 C72,-30 72,-100 48,-142Z" fill="${BR}" stroke="${OL}" stroke-width="${SW}"/>
  <path d="M-26,-142 C-36,-100 -34,-40 -26,-8 L26,-8 C34,-40 36,-100 26,-142Z" fill="#fff"/>
  <rect x="-31" y="-100" width="23" height="96" rx="11" fill="#fff" stroke="${OL}" stroke-width="${SW}"/><rect x="8" y="-100" width="23" height="96" rx="11" fill="#fff" stroke="${OL}" stroke-width="${SW}"/>
  <ellipse cx="-20" cy="-6" rx="20" ry="10" fill="#fff" stroke="${OL}" stroke-width="${SW}"/><ellipse cx="20" cy="-6" rx="20" ry="10" fill="#fff" stroke="${OL}" stroke-width="${SW}"/>
  <rect x="-42" y="-152" width="84" height="15" rx="7" fill="#3d7be0" stroke="${OL}" stroke-width="3.5"/><circle cx="0" cy="-131" r="7.5" fill="#f5c542" stroke="${OL}" stroke-width="3"/>
  ${G(o.hx||0,-196+bob,1,dogHead(o),o.tilt||0)}`;
}
function dogPeek(o={}){ // head + paws on table edge (local 0 = table top)
  const bob=Math.sin((o.t||0)*4)*3;
  return `${G(0,-62+bob,1,dogHead(o),o.tilt||0)}
  <ellipse cx="-34" cy="-4" rx="22" ry="12" fill="#fff" stroke="${OL}" stroke-width="${SW}"/><ellipse cx="34" cy="-4" rx="22" ry="12" fill="#fff" stroke="${OL}" stroke-width="${SW}"/>`;
}
function bellyDog(t=0){
  const b=1+Math.sin(t*6)*.02;
  return `<g stroke="${OL}" stroke-width="${SW}">
   <rect x="-90" y="110" width="40" height="70" rx="18" fill="#fff"/><rect x="50" y="110" width="40" height="70" rx="18" fill="#fff"/>
   <rect x="-40" y="120" width="34" height="62" rx="16" fill="#fff"/><rect x="6" y="120" width="34" height="62" rx="16" fill="#fff"/>
   <g transform="scale(${b})"><circle cx="0" cy="0" r="160" fill="${BR}"/></g>
   <path d="M-140,40 Q0,190 140,40 Q120,150 0,158 Q-120,150 -140,40Z" fill="#fff" stroke="none"/>
   <path d="M-30,60 Q0,72 30,60" fill="none" stroke-width="3"/></g>
   ${G(105,-135,.55,dogHead({expr:'tongue',t}),15)}`;
}
function basketDog(o={}){
  const ex=o.expr||'sleep',t=o.t||0,br=Math.sin(t*2.5)*2;
  return `<ellipse cx="0" cy="0" rx="140" ry="40" fill="#d9825e" stroke="${OL}" stroke-width="${SW}"/>
  <ellipse cx="0" cy="-8" rx="118" ry="26" fill="#f4b99a" stroke="${OL}" stroke-width="3"/>
  <path d="M60,-20 Q110,-40 96,-70" stroke="${OL}" stroke-width="17" fill="none" stroke-linecap="round"/><path d="M60,-20 Q110,-40 96,-70" stroke="${BR}" stroke-width="10" fill="none" stroke-linecap="round"/>
  <ellipse cx="15" cy="${-36-br}" rx="88" ry="${36+br}" fill="${BR}" stroke="${OL}" stroke-width="${SW}"/>
  <ellipse cx="-20" cy="-16" rx="40" ry="14" fill="#fff"/>
  <ellipse cx="-78" cy="-10" rx="26" ry="11" fill="#fff" stroke="${OL}" stroke-width="${SW}"/><ellipse cx="-40" cy="-8" rx="26" ry="11" fill="#fff" stroke="${OL}" stroke-width="${SW}"/>
  ${G(-70,-62,.62,dogHead({expr:ex,t}),-8)}
  ${ex==='sleep'?`<text x="-10" y="${-120-((t*30)%20)}" ${F} font-size="28" fill="#fff" stroke="${OL}" stroke-width="3" paint-order="stroke">z</text><text x="14" y="${-148-((t*30)%20)}" ${F} font-size="36" fill="#fff" stroke="${OL}" stroke-width="3" paint-order="stroke">Z</text>`:''}`;
}

/* ---------- people (bust behind table, local y=0 = table top) ---------- */
const PEOPLE={
  grandma:{skin:'#f6d3b9',shirt:'#b98be0'}, father:{skin:'#c98e5f',shirt:'#8fb8e8'},
  sophia:{skin:'#b9784e',shirt:'#e9a6d8'}, brother:{skin:'#e0a877',shirt:'#6fd17a'},
  mom:{skin:'#eab78d',shirt:'#4fc1a6'}, coach:{skin:'#a8693f',shirt:'#f07b2c'}
};
function hair(type){
  if(type==='grandma'){let s=`<ellipse cx="-50" cy="-150" rx="14" ry="26" fill="#7cc576" stroke="${OL}" stroke-width="3" transform="rotate(-25,-50,-150)"/><ellipse cx="50" cy="-150" rx="14" ry="26" fill="#7cc576" stroke="${OL}" stroke-width="3" transform="rotate(25,50,-150)"/>`;
    for(const [x,y,r] of [[-36,-170,17],[-18,-186,18],[2,-192,19],[22,-186,18],[38,-170,17],[-44,-150,13],[44,-150,13],[-8,-170,14],[14,-168,14]]) s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fbf7ea" stroke="${OL}" stroke-width="3"/>`;return s;}
  if(type==='father') return `<path d="M-44,-150 Q-46,-196 0,-196 Q46,-196 44,-150 Q30,-172 0,-170 Q-30,-172 -44,-150Z" fill="#2b1d17" stroke="${OL}" stroke-width="3"/>`;
  if(type==='sophia') return `<path d="M-46,-150 Q-48,-198 0,-198 Q48,-198 46,-150 Q20,-176 -40,-160Z" fill="#2b1d17" stroke="${OL}" stroke-width="3"/><path d="M-40,-178 Q0,-206 40,-178" stroke="#f05a9a" stroke-width="9" fill="none" stroke-linecap="round"/>`;
  if(type==='brother') return `<path d="M-44,-150 L-48,-182 L-30,-174 L-26,-200 L-10,-182 L2,-206 L14,-182 L30,-200 L32,-174 L50,-180 L44,-150 Q0,-172 -44,-150Z" fill="#2b1d17" stroke="${OL}" stroke-width="3"/>`;
  if(type==='mom') return `<circle cx="0" cy="-202" r="18" fill="#8a4b22" stroke="${OL}" stroke-width="3"/><path d="M-46,-140 Q-50,-194 0,-194 Q50,-194 46,-140 Q36,-172 0,-174 Q-36,-172 -46,-140Z" fill="#8a4b22" stroke="${OL}" stroke-width="3"/>`;
  if(type==='coach') return `<path d="M-46,-160 Q-44,-204 0,-204 Q44,-204 46,-160Z" fill="#f07b2c" stroke="${OL}" stroke-width="3"/><path d="M0,-162 L74,-160 Q70,-150 0,-152Z" fill="#d85f14" stroke="${OL}" stroke-width="3"/>`;
  return '';
}
function longHairBack(type){return type==='sophia'?`<path d="M-50,-150 Q-60,-90 -44,-70 L44,-70 Q60,-90 50,-150Z" fill="#2b1d17" stroke="${OL}" stroke-width="3"/>`:''}
function person(type,o={}){
  const p=PEOPLE[type], m=o.mouth||'smile', t=o.t||0, look=o.look||0;
  let mouth= m==='stern'?`<path d="M-12,-122 L12,-122" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`
    : m==='open'?`<ellipse cx="0" cy="-120" rx="10" ry="8" fill="#5a1e1e" stroke="${OL}" stroke-width="3"/>`
    : `<path d="M-14,-126 Q0,-112 14,-126" stroke="${OL}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  let face=`<circle cx="${-15+look*3}" cy="-148" r="5.5" fill="#1d1410"/><circle cx="${15+look*3}" cy="-148" r="5.5" fill="#1d1410"/>
   <path d="M0,-142 q-5,10 2,12" stroke="${OL}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if(type==='father'||type==='coach') face+=`<path d="M-20,-162 L-8,-158 M20,-162 L8,-158" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
  if(type==='father') mouth=`<path d="M-20,-128 Q-10,-138 0,-131 Q10,-138 20,-128 Q10,-122 0,-126 Q-10,-122 -20,-128Z" fill="#2b1d17" stroke="${OL}" stroke-width="2.5"/>`+(m==='stern'?`<path d="M-9,-116 L9,-116" stroke="${OL}" stroke-width="3.5" stroke-linecap="round"/>`:`<path d="M-9,-118 Q0,-110 9,-118" stroke="${OL}" stroke-width="3.5" fill="none"/>`);
  if(type==='grandma') face+=`<circle cx="-15" cy="-148" r="12" fill="none" stroke="${OL}" stroke-width="3"/><circle cx="15" cy="-148" r="12" fill="none" stroke="${OL}" stroke-width="3"/><line x1="-3" y1="-148" x2="3" y2="-148" stroke="${OL}" stroke-width="3"/>`;
  const arm=o.point?`<path d="M40,-80 Q90,-110 ${110},-170" stroke="${OL}" stroke-width="26" fill="none" stroke-linecap="round"/><path d="M40,-80 Q90,-110 110,-170" stroke="${p.shirt}" stroke-width="18" fill="none" stroke-linecap="round"/><circle cx="114" cy="-178" r="14" fill="${p.skin}" stroke="${OL}" stroke-width="3"/>`:'';
  return `${longHairBack(type)}
  <path d="M-60,0 L-60,-58 Q-60,-96 -22,-98 L22,-98 Q60,-96 60,-58 L60,0Z" fill="${p.shirt}" stroke="${OL}" stroke-width="${SW}"/>
  <rect x="-12" y="-110" width="24" height="16" fill="${p.skin}" stroke="${OL}" stroke-width="3"/>
  <circle cx="-44" cy="-144" r="9" fill="${p.skin}" stroke="${OL}" stroke-width="3"/><circle cx="44" cy="-144" r="9" fill="${p.skin}" stroke="${OL}" stroke-width="3"/>
  <circle cx="0" cy="-146" r="44" fill="${p.skin}" stroke="${OL}" stroke-width="${SW}"/>
  ${face}${mouth}${hair(type)}${arm}
  ${o.hands===false?'':`<circle cx="-46" cy="-4" r="13" fill="${p.skin}" stroke="${OL}" stroke-width="3"/>${o.point?'':`<circle cx="46" cy="-4" r="13" fill="${p.skin}" stroke="${OL}" stroke-width="3"/>`}`}`;
}
function family(t,lt,o={}){
  const T=['grandma','brother','father','sophia','mom'],X=[70,178,288,398,506];
  let s='';T.forEach((ty,i)=>{s+=G(X[i],600+Math.sin(t*3+i)*2,.82,person(ty,{t,mouth:o.mouth&&o.mouth[i]||'smile',look:o.look||0}))});
  return s;
}
function plates(y=598){let s='';for(const x of [70,178,398,506])s+=`<ellipse cx="${x}" cy="${y}" rx="38" ry="10" fill="#fff" stroke="${OL}" stroke-width="3"/><ellipse cx="${x}" cy="${y-4}" rx="14" ry="6" fill="#e98b3a"/><ellipse cx="${x+12}" cy="${y-3}" rx="8" ry="4" fill="#6cc46a"/>`;return s}

/* ---------- props ---------- */
